<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Imdaad · Service report</title>
<style>
:root{--navy:#1c3b67;--gold:#c09a52;--ink:#1d2433;--ink2:#5b6475;--line:#dfe4ec;--bg:#f2f4f7;--good:#1f7a4d;--goodbg:#e4f4ea;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 16px;border-bottom:1px solid var(--line)}
.top img{height:38px}
.band{background:var(--navy);color:#fff;padding:14px 16px;border-bottom:4px solid var(--gold)}
.band b{font-size:1.1rem}.band div{color:#d6dfec;font-size:.85rem;margin-top:2px}
main{max-width:640px;margin:0 auto;padding:12px 12px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card h3{margin:0 0 10px;font-size:.95rem;color:var(--navy)}
.note{background:#fff7e6;border:1px solid #f0d9a8;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:.92rem;line-height:1.5}
.ar{direction:rtl;text-align:right}
.kv{font-size:.9rem;line-height:1.7}.kv b{color:var(--navy)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ba figure{margin:0}.ba img,.more img{width:100%;height:150px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#e9edf2;cursor:zoom-in}
.ba figcaption{font-size:.78rem;color:var(--ink2);text-align:center;margin-top:3px}
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.more img{height:90px}
.lbl{font-size:.85rem;font-weight:700;margin:12px 0 5px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.rate button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 2px;font:700 .72rem Arial;color:var(--ink);cursor:pointer;min-height:52px}
.rate button span{font-weight:400}
.rate button.on{background:var(--good);border-color:var(--good);color:#fff}
label.f{display:block;font-size:.8rem;color:var(--ink2);margin:12px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:1rem Arial;color:var(--ink);background:#fff}
.pad{height:150px;border:1px dashed #9aa6b5;border-radius:10px;background:#fff;overflow:hidden}
.pad canvas{width:100%;height:100%;display:block;touch-action:none}
.link{background:none;border:0;color:#0a66c2;font-size:.85rem;padding:6px 0;cursor:pointer;text-decoration:underline}
.go{display:block;width:100%;margin-top:16px;min-height:52px;border:0;border-radius:12px;background:var(--good);color:#fff;font:700 1.05rem Arial;cursor:pointer}
.go:disabled{opacity:.6}
.err{color:var(--bad);font-size:.9rem;margin-top:8px;min-height:1em}
.done{text-align:center;padding:50px 16px}
.done .ok{width:86px;height:86px;border-radius:50%;background:var(--goodbg);color:var(--good);font-size:2.8rem;display:flex;align-items:center;justify-content:center;margin:0 auto}
.done h2{color:var(--navy)}
.foot{text-align:center;font-size:.78rem;color:var(--ink2);margin-top:22px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9}
#zoom img{max-width:96vw;max-height:92vh}
</style>
</head>

  function rate(k, en, ar) { return '<div class="lbl">' + en + ' · ' + ar + '</div><div class="rate" data-k="' + k + '">' + Q.map(function (q) { return '<button type="button" data-v="' + q[0] + '" aria-pressed="false">' + q[0] + '<br><span>' + q[1] + '</span></button>'; }).join('') + '</div>'; }
  function makePad(cv) {
    var ctx = cv.getContext('2d'), drawn = false, last = null;
    function reset() { var r = cv.getBoundingClientRect(), k = Math.min(3, window.devicePixelRatio || 1); cv.width = r.width * k; cv.height = r.height * k; ctx.setTransform(k, 0, 0, k, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14223a'; drawn = false; }

  }
